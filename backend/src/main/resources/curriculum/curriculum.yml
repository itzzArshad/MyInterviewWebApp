              - lld-atm: ATM
              - lld-elevator: Elevator System
              - lld-food-ordering: Food Ordering System
              - lld-notification-service: Notification Service
              - lld-payment-processing: Payment Processing System
          - slug: hld-fundamentals
            title: High-Level Design Fundamentals
            concepts:
              - requirements-nfr: Functional and non-functional requirements
              - scalability: "Scalability: vertical and horizontal"
              - availability-reliability: Availability and reliability
              - latency-throughput: Latency and throughput
              - load-balancing: Load balancing
              - caching-at-scale: Caching at scale
              - sql-vs-nosql: SQL vs NoSQL
              - replication-sharding: Replication and sharding
              - cap-theorem: CAP theorem
              - consistency-models: Consistency models
              - fault-tolerance: Fault tolerance
          - slug: hld-problems
            title: HLD Practice Problems
            concepts:
              - hld-url-shortener: URL Shortener
              - hld-whatsapp: Chat application (WhatsApp)
              - hld-instagram: Photo sharing (Instagram)
              - hld-youtube: Video streaming (YouTube)
              - hld-notification-system: Notification System
              - hld-ecommerce: E-commerce backend
              - hld-ride-booking: Ride booking system
              - hld-rate-limiter: Distributed rate limiter
