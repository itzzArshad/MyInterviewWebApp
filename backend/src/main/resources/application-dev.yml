# Local development against a local PostgreSQL (same engine as production).
# Credentials are read from backend/.env.local (git-ignored) — see README "Local PostgreSQL".
# Any value can be overridden with environment variables.
spring:
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/academy}
    username: ${ACADEMY_DB_USERNAME:academy}
    password: ${ACADEMY_DB_PASSWORD:}

academy:
  jwt:
    secret: ${ACADEMY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  owner:
    username: ${ACADEMY_OWNER_USERNAME:me}
    password: ${ACADEMY_OWNER_PASSWORD:changeme-dev}
    display-name: ${ACADEMY_OWNER_DISPLAY_NAME:Developer}
  cookie:
    secure: false   # localhost is plain http

logging:
  level:
    com.academy: DEBUG
