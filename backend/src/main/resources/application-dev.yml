# Local development: file-based H2 in PostgreSQL mode, no Docker needed.
# Override any value with environment variables (see backend/.env.example).
spring:
  datasource:
    url: jdbc:h2:file:./data/academy-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

academy:
  jwt:
    secret: ${ACADEMY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  owner:
    username: ${ACADEMY_OWNER_USERNAME:me}
    password: ${ACADEMY_OWNER_PASSWORD:changeme-dev}
    display-name: ${ACADEMY_OWNER_DISPLAY_NAME:Developer}
  cookie:
    secure: false   # localhost is plain http

logging:
  level:
    com.academy: DEBUG
