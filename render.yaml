# Render Blueprint — Spring Boot API on Render's free plan.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once.
services:
  - type: web
    name: academy-api
    runtime: docker
    plan: free
    region: singapore              # closest Render region to India; create the Neon DB in AWS Singapore too
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths: ["backend/**"]        # frontend/docs changes don't redeploy the API
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL            # Neon POOLED string, pasted as-is (postgresql://…-pooler…?sslmode=require…)
        sync: false
      - key: DATABASE_URL_UNPOOLED   # Neon DIRECT string, pasted as-is — used for Flyway migrations
        sync: false
      - key: ACADEMY_JWT_SECRET
        generateValue: true          # random 256-bit secret generated by Render
      - key: ACADEMY_OWNER_USERNAME
        sync: false
      - key: ACADEMY_OWNER_PASSWORD  # your real login password (min 8 chars) — only ever stored hashed
        sync: false
      - key: ACADEMY_OWNER_DISPLAY_NAME
        sync: false
      - key: GITHUB_CONTENT_REPO
        value: itzzArshad/academy-content
      - key: GITHUB_CONTENT_TOKEN    # fine-grained PAT: Contents read/write on academy-content only
        sync: false
