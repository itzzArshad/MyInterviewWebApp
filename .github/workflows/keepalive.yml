# Render's free plan sleeps the API after 15 idle minutes (first request then takes ~50 s).
# This pings it every 10 minutes so the app stays responsive. One free service running 24/7
# fits inside Render's 750 free instance-hours per month.
#
# Setup: repo Settings → Secrets and variables → Actions → Variables → New variable
#   BACKEND_URL = https://academy-api.onrender.com   (your Render URL)
#
# Note: GitHub pauses scheduled workflows in repos with no activity for 60 days — re-enable from the Actions tab.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        if: ${{ vars.BACKEND_URL != '' }}
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${{ vars.BACKEND_URL }}/actuator/health"
