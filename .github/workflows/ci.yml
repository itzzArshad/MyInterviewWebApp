# Runs backend tests against a real PostgreSQL and checks the frontend builds — on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACADEMY_DB_USERNAME: academy
      ACADEMY_DB_PASSWORD: academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
